name: test and deploy

# The acceptance tests gate the deploy. If the physics invariants or the
# generator's identification gates fail, nothing ships — a broken simulator that
# still renders a pretty page is the failure mode this repo exists to avoid.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # A venv, not --system: the runner's system Python is Debian-managed and
      # refuses installs (PEP 668 externally-managed-environment). uv picks up
      # ./.venv automatically for both `pip install` and `run`.
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: acceptance tests, property invariants and identification gates
        run: uv run pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install -e "." marimo
      - name: build the site (every figure recomputed from source)
        run: uv run python scripts/build_site.py
      - name: build the wheel the WASM app installs at runtime
        # Pyodide has no site-packages to install into, so the app micropips
        # this wheel from a relative URL. It must be rebuilt whenever the source
        # changes or the deployed app silently runs stale code.
        run: uv build --wheel -o dist
      - name: export the marimo app to WebAssembly
        run: |
          uv run marimo export html-wasm app/coldspend_app.py -o site/app --mode run
          cp dist/coldspend-*.whl site/app/
          rm -f site/app/CLAUDE.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
